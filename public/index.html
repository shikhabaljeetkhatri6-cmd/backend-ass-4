<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Connect - Chat</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
    input, button { padding: 10px; margin: 5px 0; }
    input { box-sizing: border-box; width: 100%; }
    button { cursor: pointer; }
    #messages { border: 1px solid #ccc; min-height: 220px; padding: 12px; list-style: none; }
    #messages li { margin: 8px 0; overflow-wrap: anywhere; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>Secure Connect – Real-Time Chat</h1>
  <p class="muted">Log in through Postman first, then paste the JWT token below.</p>
  <label for="token">JWT token</label>
  <input id="token" placeholder="Paste your login token here" />
  <label for="room">Room</label>
  <input id="room" value="general" />
  <button id="connect">Connect</button>
  <p id="status" class="muted">Not connected</p>
  <ul id="messages"></ul>
  <form id="chatForm">
    <input id="message" placeholder="Type a message..." autocomplete="off" required />
    <button type="submit">Send</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket;
    const status = document.getElementById("status");
    const messages = document.getElementById("messages");
    const addMessage = (text) => {
      const li = document.createElement("li");
      li.textContent = text;
      messages.appendChild(li);
    };

    document.getElementById("connect").addEventListener("click", () => {
      const token = document.getElementById("token").value.trim();
      const room = document.getElementById("room").value.trim() || "general";
      if (!token) return alert("Paste a JWT token first.");
      if (socket) socket.disconnect();

      socket = io({ auth: { token } });
      socket.on("connect", () => {
        status.textContent = "Connected";
        socket.emit("joinRoom", room);
      });
      socket.on("connect_error", (error) => {
        status.textContent = "Connection failed: " + error.message;
      });
      socket.on("systemMessage", addMessage);
      socket.on("chatMessage", (data) => {
        addMessage(`[${data.room}] ${data.username}: ${data.message}`);
      });
      socket.on("disconnect", () => { status.textContent = "Disconnected"; });
    });

    document.getElementById("chatForm").addEventListener("submit", (event) => {
      event.preventDefault();
      if (!socket || !socket.connected) return alert("Connect first.");
      const messageInput = document.getElementById("message");
      const room = document.getElementById("room").value.trim() || "general";
      socket.emit("chatMessage", { room, message: messageInput.value });
      messageInput.value = "";
    });
  </script>
</body>
</html>
